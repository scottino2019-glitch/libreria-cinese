<div style="width: 100%; max-width: 440px; font-family: system-ui, -apple-system, sans-serif;">
    <h3 style="margin: 0 0 12px; color: #1a1a1a; font-size: 18px;">Test Modi di dire (成语 - Chengyu)</h3>
    <p style="color: #666; font-size: 14px; margin-bottom: 20px;">Indovina il significato del proverbio tradizionale a quattro caratteri.</p>

    <div style="background: #f8f9fa; padding: 16px; border-radius: 10px; border: 1px solid #e5e5e5; margin-bottom: 16px;">
        <p style="font-weight: 700; margin: 0 0 10px; font-size: 17px; color: #00dc64;">马到成功 (mǎ dào chéng gōng)</p>
        <p style="margin: 0 0 12px; font-size: 13px; color: #555;">Letteralmente: "Al giungere del cavallo, arriva il successo".</p>
        <div style="display: flex; flex-direction: column; gap: 8px;">
            <button class="ex-btn" onclick="checkEx(this, true)" style="padding: 10px 14px; background: white; border: 1px solid #ddd; border-radius: 8px; text-align: left; cursor: pointer; font-size: 14px;">A) Ottenere un successo immediato / rapido</button>
            <button class="ex-btn" onclick="checkEx(this, false)" style="padding: 10px 14px; background: white; border: 1px solid #ddd; border-radius: 8px; text-align: left; cursor: pointer; font-size: 14px;">B) Cavalcare fino alla meta</button>
            <button class="ex-btn" onclick="checkEx(this, false)" style="padding: 10px 14px; background: white; border: 1px solid #ddd; border-radius: 8px; text-align: left; cursor: pointer; font-size: 14px;">C) Lavorare duro come un cavallo</button>
        </div>
        <div class="feedback" style="margin-top: 8px; font-size: 13px; font-weight: 600; display: none;"></div>
    </div>
</div>

<script>
function checkEx(btn, isCorrect) {
    const parent = btn.parentElement;
    const fb = parent.nextElementSibling;
    parent.querySelectorAll('.ex-btn').forEach(b => {
        b.style.borderColor = '#ddd';
        b.style.background = 'white';
    });
    fb.style.display = 'block';
    if (isCorrect) {
        btn.style.borderColor = '#00dc64';
        btn.style.background = '#e6fbee';
        fb.style.color = '#00b34e';
        fb.innerText = 'Esatto! Augura un successo immediato all\'inizio di una nuova impresa.';
    } else {
        btn.style.borderColor = '#e53e3e';
        btn.style.background = '#fff5f5';
        fb.style.color = '#e53e3e';
        fb.innerText = 'Non è corretto, riprova!';
    }
}
</script>
