      <stop offset="0%" stop-color="#00dc64"/>
      <stop offset="100%" stop-color="#00b34e"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#primaryGrad)"/>
  <!-- Open Book and Chinese character '文' / '中' -->
  <g fill="#ffffff" transform="translate(106, 120)">
