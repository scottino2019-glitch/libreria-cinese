    <path d="M150 160 C 220 120, 280 120, 300 130 L 300 240 C 280 230, 220 230, 150 260 C 80 230, 20 230, 0 240 L 0 130 C 20 120, 80 120, 150 160 Z" opacity="0.95"/>
